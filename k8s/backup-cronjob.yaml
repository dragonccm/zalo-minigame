# Sao lưu hằng đêm lúc 3:00 (giờ máy chủ): pg_dump + nén thư mục data (game đã upload).
# Giữ 14 ngày. Bản sao lưu nằm trên PVC gamehub-backups — nên chép định kỳ ra ngoài VPS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gamehub-backups
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: { storage: 10Gi }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gamehub-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:17
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: gamehub-secrets, key: PGPASSWORD } }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  ts=$(date +%Y%m%d-%H%M)
                  pg_dump -h postgres -U gamehub -d gamehub -Fc -f /backups/db-$ts.dump
                  tar -czf /backups/data-$ts.tar.gz -C /data games submissions
                  find /backups -type f -mtime +14 -delete
                  ls -lh /backups
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: data, mountPath: /data, readOnly: true }
          volumes:
            - name: backups
              persistentVolumeClaim: { claimName: gamehub-backups }
            - name: data
              persistentVolumeClaim: { claimName: gamehub-data }
