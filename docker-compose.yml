# PostgreSQL cho GameHub:  docker compose up -d db
services:
  db:
    image: postgres:17
    container_name: gamehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: ${PGPASSWORD:-gamehub_dev_pw}
      POSTGRES_DB: gamehub
    ports:
      - "127.0.0.1:${PGPORT:-55440}:5432"
    volumes:
      - gamehub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehub -d gamehub"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  gamehub_pg:
